<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bé Bủn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🌸 Bé Bủn 🌸</h1>
    <p class="subtitle">Bấm vào nút bên dưới để xem một hình ảnh động ngẫu nhiên do AI tạo ra!</p>

    <button id="randomBtn">✨ Xem ảnh động ngẫu nhiên ✨</button>

    <div id="result">
      <img id="gifImage" src="" alt="Ảnh động ngẫu nhiên" hidden />
      <p id="loading" hidden>Đang tải ảnh...</p>
      <p id="error" hidden>Không tải được ảnh, thử lại nhé!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
